services:
  - type: cron
    name: ff-prealerts-all
    env: python
    # EUR 06:30–10:30 UTC, USD 12:00–16:00 UTC, Fed 18:00–19:00 UTC
    # además 06:00 UTC incluye el digest 03:00 BA
    schedule: "*/5 6-10,12-16,18-19 * * 1-5"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u news-bot-eurusd-json.py"
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
