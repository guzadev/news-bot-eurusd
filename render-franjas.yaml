services: []

# --- CRON JOBS (UTC) ---
# EUR eventos 03:30–07:30 BA → prealertas 03:00–07:00 BA → 06:00–10:00 UTC
# USD eventos 09:00–13:00 BA → prealertas 08:30–12:30 BA → 11:30–15:30 UTC
# Fed opcional 15:00–16:00 BA → prealertas 14:30–15:30 BA → 17:30–18:30 UTC
cronJobs:
  - name: ff-prealert-eur
    type: cron
    env: python
    schedule: "*/5 6-10 * * 1-5"       # UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u news-bot-eurusd-json.py --prealert --lead 30 --window 330"
    autoDeploy: true
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false

  - name: ff-prealert-usd
    type: cron
    env: python
    schedule: "*/5 11-15 * * 1-5"      # UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u news-bot-eurusd-json.py --prealert --lead 30 --window 330"
    autoDeploy: true
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false

  - name: ff-prealert-fed
    type: cron
    env: python
    schedule: "*/5 17-18 * * 1-5"      # UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u news-bot-eurusd-json.py --prealert --lead 30 --window 330"
    autoDeploy: true
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
